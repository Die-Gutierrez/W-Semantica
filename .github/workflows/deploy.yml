name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /root/W-Semantica
            # Traer los últimos cambios descartando cualquier cambio local si existiera
            git fetch --all
            git reset --hard origin/main
            # Actualizar dependencias de python si hay cambios
            source .venv/bin/activate
            pip install -r requirements.txt
            # Reiniciar la aplicación completa usando PM2 (inicia si no está corriendo)
            pm2 restart iot-proyecto || pm2 start run_all.py --name "iot-proyecto" --interpreter .venv/bin/python
            # Mostrar estado actual de los procesos gestionados
            pm2 status
